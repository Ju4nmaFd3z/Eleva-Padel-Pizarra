<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Eleva Pádel</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Rutas absolutas a propósito: esta página se sirve desde cualquier ruta inexistente -->
  <link rel="stylesheet" href="/css/fonts.css?v=20260930">
  <!-- El resto va embebido: sin JS y sin más dependencias -->
  <style>
    :root { --black:#1A1A1A; --cream:#F5F0E8; --gold:#C4A882; --gold-ink:#8A6D45; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.25rem;
      background: var(--black); color: var(--cream);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 300; text-align: center;
    }
    .wrap { max-width: 32rem; }
    .code {
      font-family: 'Space Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
      font-size: .75rem; letter-spacing: .28em; text-transform: uppercase;
      color: var(--gold); margin: 0 0 1.75rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-weight: 300; font-size: clamp(2.25rem, 8vw, 3.5rem);
      line-height: 1.05; margin: 0 0 1rem;
    }
    p { font-size: 1rem; line-height: 1.6; color: rgba(245,240,232,.72); margin: 0 0 2.5rem; }
    .links { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
    a {
      display: inline-block; padding: .9rem 1.6rem;
      font-size: .8rem; letter-spacing: .16em; text-transform: uppercase;
      text-decoration: none; border: 1px solid var(--gold); color: var(--gold);
      transition: background-color .25s ease, color .25s ease;
    }
    a.primary { background: var(--gold); color: var(--black); }
    a:hover, a:focus-visible { background: var(--cream); border-color: var(--cream); color: var(--black); }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="code">Error 404</p>
    <h1>Esta página no existe.</h1>
    <p>El enlace puede estar mal escrito o la página ya no está disponible.</p>
    <div class="links">
      <a class="primary" href="/pizarra">Club de Pizarra</a>
      <a href="/">Eleva Pádel</a>
    </div>
  </main>
</body>
</html>
