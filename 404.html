<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title data-i18n="e404.title">Página no encontrada · Eleva Pádel</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Rutas absolutas a propósito: esta página se sirve desde cualquier ruta inexistente.
       Idioma: el guardado o el del navegador (js/idioma.js, antes de pintar);
       sin JS, en español y sin selector. -->
  <script src="/js/idioma.js?v=20261108c"></script>
  <link rel="stylesheet" href="/css/fonts.css?v=20261108c">
  <style>
    :root { --negro:#000; --crema:#EDE4DC; --claro:#DBD2CC; --beige:#947E6B; --anillo:#A18572; --linea:rgba(161,133,114,.35); --tinta:#181411; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 4.5rem max(1rem, env(safe-area-inset-right)) 2rem max(1rem, env(safe-area-inset-left));
      background: var(--negro); color: var(--claro);
      font: 400 1.0625rem/1.6 'Barlow', system-ui, sans-serif; text-align: center;
    }
    main { max-width: 32rem; }
    main img { display: block; width: 5rem; height: 5rem; margin: 0 auto 1.5rem; }
    h1 {
      margin: 0 0 1rem; color: var(--crema);
      font: 600 clamp(2.25rem, 9vw, 3.5rem)/1.05 'Barlow Condensed', 'Arial Narrow', sans-serif;
      text-transform: uppercase;
    }
    p { margin: 0 0 2rem; }
    .enlaces { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
    a {
      display: inline-flex; align-items: center; justify-content: center; min-height: 3rem;
      padding: .625rem 1.25rem; border: 2px solid var(--beige); border-radius: 2px;
      background: var(--beige); color: var(--negro); text-decoration: none;
      font: 600 1.125rem/1.1 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: .04em;
    }
    a.secundario { background: transparent; color: var(--crema); border-color: var(--anillo); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--crema); outline-offset: 3px; }
    @media (hover: hover) { a:hover { background: var(--crema); border-color: var(--crema); color: var(--negro); } }
    /* Selector de idioma: el mismo de la web (css/main.css), arriba a la derecha */
    .i18n-pendiente [data-i18n] { visibility: hidden; }
    .idioma-selector { position: absolute; top: max(.75rem, env(safe-area-inset-top)); right: max(1rem, env(safe-area-inset-right)); text-align: left; }
    .idioma-boton {
      display: inline-flex; align-items: center; justify-content: center; gap: .125rem;
      min-width: 44px; min-height: 44px; padding: 0 .375rem;
      background: transparent; color: var(--crema); border: 1px solid var(--linea); border-radius: 2px;
      font: 500 1rem/1 'Barlow', system-ui, sans-serif; cursor: pointer;
    }
    .icono { width: 1.125em; height: 1.125em; flex-shrink: 0; stroke: currentColor; }
    .idioma-boton[aria-expanded="true"] .icono { transform: rotate(180deg); }
    .idioma-lista {
      position: absolute; right: 0; top: calc(100% + .5rem); z-index: 60;
      min-width: 11rem; margin: 0; padding: .375rem; list-style: none;
      background: var(--negro); border: 1px solid var(--linea); border-radius: 2px;
    }
    .idioma {
      display: flex; align-items: center; gap: .75rem; width: 100%;
      min-height: 44px; padding: 0 .75rem;
      background: transparent; color: var(--crema); border: 0; border-radius: 2px;
      font: 500 1rem/1.2 'Barlow', system-ui, sans-serif; text-align: left; cursor: pointer;
    }
    .idioma-codigo { min-width: 1.75em; font-weight: 600; }
    .idioma[aria-current="true"] { background: var(--crema); color: var(--negro); }
    @media (hover: hover) { .idioma:not([aria-current="true"]):hover { background: var(--tinta); } }
    .idioma:focus-visible { outline-offset: -3px; }
  </style>
  <noscript><style>.idioma-selector { display: none; } body { padding-top: 2rem; }</style></noscript>
</head>
<body>
  <div class="idioma-selector">
    <button type="button" class="idioma-boton" aria-expanded="false" aria-controls="idiomas" aria-label="Idioma: ES" data-i18n-attr="aria-label:nav.langLabel"><span class="idioma-actual">ES</span><svg class="icono" aria-hidden="true" focusable="false"><use href="/assets/icons/lucide.svg#chevron-down"></use></svg></button>
    <ul id="idiomas" class="idioma-lista" hidden>
      <li><button type="button" class="idioma" data-lang="es" lang="es" aria-current="true"><span class="idioma-codigo">ES</span> Español</button></li>
      <li><button type="button" class="idioma" data-lang="en" lang="en"><span class="idioma-codigo">EN</span> English</button></li>
      <li><button type="button" class="idioma" data-lang="nl" lang="nl"><span class="idioma-codigo">NL</span> Nederlands</button></li>
    </ul>
  </div>
  <main>
    <img src="/assets/img/logo-sin-fondo.svg" width="80" height="80" alt="Eleva Pádel">
    <h1 data-i18n="e404.heading">Esta página no existe</h1>
    <p data-i18n="e404.text">El enlace puede estar mal escrito o la página ya no está disponible.</p>
    <div class="enlaces">
      <a href="/pizarra">Eleva Pádel Pizarra</a>
      <a class="secundario" href="/">Eleva Pádel</a>
    </div>
  </main>
  <script src="/js/translations.js?v=20261108c" defer></script>
  <script src="/js/main.js?v=20261108c" defer></script>
</body>
</html>
