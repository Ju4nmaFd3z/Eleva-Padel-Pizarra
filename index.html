<!DOCTYPE html>
<!-- Web de la MARCA Eleva Pádel (raíz /). Desde aquí se accede a los clubes.
     Solo lleva lo confirmado: nombre, logotipo, los clubes y el pie.
     Pendientes (valores propuestos solo en CONFIRMAR.md):
       PENDIENTE_MARCA: qué ofrece la marca a los clubes y cómo unirse
       PENDIENTE_MARCA: contacto comercial (WhatsApp/teléfono) e Instagram
       PENDIENTE_MARCA: año de fundación, zona de actuación y CTA -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eleva Pádel</title>
  <meta name="description" content="Eleva Pádel y su club de Pizarra, Málaga.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">

  <link rel="canonical" href="https://eleva-padel-pizarra.vercel.app/">
  <link rel="alternate" hreflang="x-default" href="https://eleva-padel-pizarra.vercel.app/">

  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="Eleva Pádel">
  <meta property="og:url"         content="https://eleva-padel-pizarra.vercel.app/">
  <meta property="og:title"       content="Eleva Pádel">
  <meta property="og:description" content="Eleva Pádel y su club de Pizarra, Málaga.">
  <meta property="og:locale"      content="es_ES">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://eleva-padel-pizarra.vercel.app/#organization",
    "name": "Eleva Pádel",
    "url": "https://eleva-padel-pizarra.vercel.app/",
    "logo": "https://eleva-padel-pizarra.vercel.app/apple-touch-icon.png",
    "subOrganization": {
      "@type": "SportsActivityLocation",
      "@id": "https://eleva-padel-pizarra.vercel.app/pizarra#club",
      "name": "Eleva Pádel Pizarra",
      "url": "https://eleva-padel-pizarra.vercel.app/pizarra"
    }
  }
  </script>

  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/barlow-condensed-600-latin.woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css?v=20261004c">
  <link rel="stylesheet" href="css/main.css?v=20261004c">
  <link rel="stylesheet" href="css/movimiento.css?v=20261004c">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Sin JS el selector de idioma no sirve (los textos se cambian en el navegador) -->
  <noscript><style>.idioma-selector { display: none; }</style></noscript>
</head>
<body class="marca">

<a href="#contenido" class="saltar" data-i18n="skip.link">Saltar al contenido principal</a>

<header class="cabecera">
  <div class="cabecera-barra">
    <a href="#contenido" class="logo" aria-label="Eleva Pádel, inicio" data-i18n-arialabel="home.logoLabel">
      <img src="assets/img/logo-sin-fondo.svg" width="40" height="40" alt="">
      <span class="logo-nombre">Eleva Pádel</span>
    </a>
    <div class="idioma-selector">
      <button type="button" class="idioma-boton" aria-expanded="false" aria-controls="idiomas" aria-label="Idioma: ES"><span class="idioma-actual">ES</span><svg class="icono" aria-hidden="true" focusable="false"><use href="assets/icons/lucide.svg#chevron-down"></use></svg></button>
      <ul id="idiomas" class="idioma-lista" hidden>
        <li><button type="button" class="idioma" data-lang="es" lang="es" aria-current="true"><span class="idioma-codigo">ES</span> Español</button></li>
        <li><button type="button" class="idioma" data-lang="en" lang="en"><span class="idioma-codigo">EN</span> English</button></li>
        <li><button type="button" class="idioma" data-lang="nl" lang="nl"><span class="idioma-codigo">NL</span> Nederlands</button></li>
      </ul>
    </div>
  </div>
</header>

<main id="contenido">

<!-- El logo grande y el nombre; con el scroll el logo se abre hacia el club -->
<section class="marca-hero" aria-labelledby="titulo">
  <img class="marca-logo" src="assets/img/logo-sin-fondo.svg" width="400" height="400" alt="" fetchpriority="high">
  <h1 id="titulo" class="marca-titulo"><span class="hero-linea">Eleva</span> <span class="hero-linea">Pádel</span></h1>
</section>

<!-- Borrador local de la marca (solo en el servidor local; ver MARCA-borrador.md) -->
<div id="marca-borrador" hidden></div>

<section class="seccion" data-superficie="tinta" aria-labelledby="clubes-titulo">
  <h2 id="clubes-titulo" data-i18n="home.clubs.heading">Clubes</h2>
  <ul class="clubes">
    <li>
      <a class="club" href="pizarra/index.html">
        <span class="club-foto"><img src="assets/img/hero.jpg" width="800" height="600" alt="" loading="lazy" decoding="async"></span>
        <span class="club-texto">
          <span class="club-nombre">Eleva Pádel Pizarra</span>
          <span class="club-lugar">Pizarra, Málaga</span>
          <span class="enlace con-icono"><span data-i18n="home.clubs.visit">Ver el club</span><svg class="icono" aria-hidden="true" focusable="false"><use href="assets/icons/lucide.svg#arrow-right"></use></svg></span>
        </span>
      </a>
    </li>
  </ul>
</section>

</main>

<footer class="pie" aria-label="Pie de página" data-i18n-arialabel="footer.ariaLabel">
  <div class="pie-legal">
    <a href="privacidad.html" data-i18n="footer.legalLink">Aviso legal y privacidad</a>
    <p><span data-i18n="footer.credit">Desarrollado por</span>
      <a href="https://biznagaconsulting.es/" target="_blank" rel="noopener noreferrer">Biznaga Consulting</a></p>
  </div>
</footer>

<script src="js/translations.js?v=20261004c" defer></script>
<script src="js/main.js?v=20261004c" defer></script>
<script src="js/movimiento/nucleo.js?v=20261004c" defer></script>
<script src="js/movimiento/scroll.js?v=20261004c" defer></script>
<script src="js/movimiento/puntero.js?v=20261004c" defer></script>
</body>
</html>
